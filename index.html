<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeHub - Food Recipe App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="logo">🍴 Recipe<span>Hub</span></div>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#recipes">Recipes</a>
                <a href="#categories">Categories</a>
            </div>

            <button class="favorite-btn" onclick="showFavorites()">
                ❤️ Favorites
            </button>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <p class="small-title">WELCOME TO RECIPEHUB</p>
            <h1>Cook something<br><span>delicious today.</span></h1>
            <p>
                Discover simple, delicious recipes that make every meal
                special.
            </p>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for recipes..."
                    onkeyup="searchRecipes()"
                >
                <button onclick="searchRecipes()">🔍</button>
            </div>
        </div>

        <div class="hero-image">
            <div class="food-circle">🍝</div>
        </div>
    </section>

    <!-- Categories -->
    <section class="categories" id="categories">
        <h2>Explore Categories</h2>

        <div class="category-container">
            <button onclick="filterCategory('All')">🍽️ All</button>
            <button onclick="filterCategory('Breakfast')">🍳 Breakfast</button>
            <button onclick="filterCategory('Lunch')">🍛 Lunch</button>
            <button onclick="filterCategory('Dinner')">🍝 Dinner</button>
            <button onclick="filterCategory('Dessert')">🍰 Dessert</button>
            <button onclick="filterCategory('Drinks')">🥤 Drinks</button>
        </div>
    </section>

    <!-- Recipes -->
    <section class="recipes" id="recipes">
        <div class="section-heading">
            <div>
                <p>OUR COLLECTION</p>
                <h2>Popular Recipes</h2>
            </div>
            <span id="recipeCount"></span>
        </div>

        <div class="recipe-grid" id="recipeGrid">
            <!-- Recipes generated by JavaScript -->
        </div>
    </section>

    <!-- Recipe Modal -->
    <div class="modal" id="recipeModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>

            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <h2>🍴 RecipeHub</h2>
        <p>Good food. Good mood. ❤️</p>
        <p class="copyright">
            © 2026 RecipeHub. All rights reserved.
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
